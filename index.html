<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fuel & Lift">
<meta name="theme-color" content="#16201B">
<title>Fuel &amp; Lift</title>
<meta name="description" content="Food, training, recovery and health tracking, with Claude reading what you type.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --surface-2:#E7ECE6; --ink:#16201B; --ink-2:#48544D; --ink-3:#6F7B74; --line:#D3DAD3;
  --protein:#C8551B; --carbs:#0E9A82; --fat:#6E5BCF; --water:#2B78C2;
  --good:#2E7D32; --warn:#A56300; --bad:#BF3A2B;
  --btn:#16201B; --btn-ink:#F1F4F0; --focus:#2B78C2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1411; --surface:#171D19; --surface-2:#222A24; --ink:#E6ECE8; --ink-2:#AEB9B2; --ink-3:#86918B; --line:#2E3731;
    --protein:#D9733C; --carbs:#1FA08A; --fat:#8A78E6; --water:#4F9BE0;
    --good:#62BD68; --warn:#E0A33A; --bad:#E86C5E; --btn:#E6ECE8; --btn-ink:#0F1411; --focus:#4F9BE0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1411; --surface:#171D19; --surface-2:#222A24; --ink:#E6ECE8; --ink-2:#AEB9B2; --ink-3:#86918B; --line:#2E3731;
  --protein:#D9733C; --carbs:#1FA08A; --fat:#8A78E6; --water:#4F9BE0;
  --good:#62BD68; --warn:#E0A33A; --bad:#E86C5E; --btn:#E6ECE8; --btn-ink:#0F1411; --focus:#4F9BE0;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.brand span{color:var(--protein)}
.datenav{display:flex;align-items:center;gap:4px}
.datenav .d{font-weight:600;min-width:118px;text-align:center;font-size:14px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--ink-3)}
.linkbtn{border:0;background:none;color:var(--water);cursor:pointer;font-weight:600;font-size:13px;padding:4px 6px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:520px}
.tab{border:0;background:none;padding:8px 4px;border-radius:8px;cursor:pointer;font-family:var(--display);font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.tab[aria-current="page"]{background:var(--btn);color:var(--btn-ink)}

main{padding-block:16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:860px){.grid.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* logger */
.logger textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;line-height:1.4}
.logger textarea:focus{border-color:var(--ink-3)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.sm{padding:6px 11px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.photo-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:4px 6px 4px 4px;font-size:13px}
.photo-pill img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.status{font-size:13.5px;color:var(--ink-2);min-height:1em}
.status.err{color:var(--bad)}
.spacer{flex:1}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2)}
.tag.est{color:var(--warn)}

/* energy */
.energy{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.big{font-family:var(--display);font-size:52px;line-height:.9;font-weight:700;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--ink-3);font-weight:600}
@media (max-width:520px){.energy{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative}
.meter > i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ink)}
.meter.over > i{background:var(--bad)}
.macros{display:grid;gap:10px}
.macro{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center;font-size:14px}
.macro .lbl{display:flex;align-items:center;gap:6px;font-weight:600}
.swatch{width:10px;height:10px;border-radius:3px;flex:none}
.macro .v{text-align:right;font-variant-numeric:tabular-nums}

/* water */
.water-top{display:flex;align-items:baseline;gap:8px}
.water-top .big{font-size:40px}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:14px;height:20px;border:1.5px solid var(--water);border-radius:2px 2px 4px 4px;background:transparent}
.glass.on{background:var(--water)}

/* lists */
.meal{display:flex;flex-direction:column;gap:2px}
.meal-h{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);border-bottom:1px solid var(--line);padding-block:4px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding-block:8px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item .kc{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.acts{display:flex;gap:2px}
.acts button{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:13px}
.acts button:hover{background:var(--surface-2);color:var(--ink)}
.empty{color:var(--ink-3);font-size:14px;padding-block:6px}

/* nutrition-facts style micros */
.facts{border:2px solid var(--ink);border-radius:4px;padding:10px 12px}
.facts .fh{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;border-bottom:8px solid var(--ink);padding-bottom:6px;text-transform:none}
.facts .dvh{display:flex;justify-content:flex-end;font-size:12px;font-weight:700;border-bottom:1px solid var(--ink);padding-block:4px}
.facts .fr{display:grid;grid-template-columns:1fr 92px 48px;gap:8px;align-items:center;padding-block:5px;border-bottom:1px solid var(--line);font-size:13.5px}
.facts .fr:last-child{border-bottom:0}
.facts .fr b{font-weight:600}
.facts .fr .amt{color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.facts .fr .dv{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.facts .fr .dv.over{color:var(--bad)}
.facts .fr .dv.low{color:var(--ink-3)}
.facts .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:-2px}
.facts .bar i{display:block;height:100%;background:var(--ink-2);border-radius:2px}
.facts .bar i.over{background:var(--bad)}
.facts .bar i.done{background:var(--good)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.tile .v{font-family:var(--display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.delta{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--ink-3)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td.l,th.l{white-space:normal}
th.r,td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--surface-2)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 4}
.chart .ref-t{fill:var(--ink-2);font-weight:600}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:6px;white-space:pre;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.18)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 10px;font-weight:400;color:var(--ink);width:100%}
.field .hint{font-weight:400;color:var(--ink-3);font-size:12px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}

.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hgrid .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.hgrid .meter{margin-block:6px 2px}
.pill{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1.5px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.stk{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;cursor:pointer}
.stk .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.stk.on{border-color:var(--good)} .stk.on .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.tiles.five{grid-template-columns:repeat(2,1fr)} .tiles.five .tile:last-child{grid-column:1/-1}
@media (min-width:860px){.tiles.five{grid-template-columns:repeat(5,1fr)} .tiles.five .tile:last-child{grid-column:auto}}
.qcard{border:1.5px solid var(--ink-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.qhead{font-weight:700}
.qs{display:flex;flex-direction:column;gap:12px}
.q{display:flex;flex-direction:column;gap:6px}
.qt{font-size:14px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.qin{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;width:100%}
.act{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act-h{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.act .nm{font-weight:600}
.act .sub{font-size:12.5px;color:var(--ink-3)}
.rec{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:8px;padding:10px}
.tips{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.how summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.how ul{margin:6px 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.setup{max-width:720px;margin-inline:auto;width:100%}
.setup p{margin:0}
.banner .linkbtn{margin-left:4px}
.findings{display:flex;flex-direction:column;gap:10px}
.finding{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.rev-head{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.ideas{display:grid;gap:8px}
.idea{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.idea .linkbtn{align-self:flex-start;padding-left:0}
.tab{font-size:15px;letter-spacing:.04em;padding-inline:2px}
.plan-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:14px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,14,12,.45)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.meter>i,.facts .bar i{transition:width .35s ease}}

/* standalone additions */
[hidden]:not([hidden=until-found i]){display:none!important}
@media (max-width:420px){.brand{font-size:20px}.datenav{gap:2px}.datenav .d{min-width:0;font-size:13px}.iconbtn{width:30px;height:30px}}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:3px;background:transparent}
.sync.synced{background:var(--good)} .sync.saving{background:var(--warn)} .sync.offline{background:var(--ink-3)} .sync.error{background:var(--bad)}
.setup{margin-top:24px}
.setup p{line-height:1.5}
body{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Fuel <span>&amp;</span> Lift <i id="syncDot" class="sync" aria-hidden="true"></i></div>
    <div class="datenav">
      <button class="iconbtn" id="prevDay" aria-label="Previous day">&#8249;</button>
      <div class="d" id="dateLabel">Today</div>
      <button class="iconbtn" id="nextDay" aria-label="Next day">&#8250;</button>
      <button class="linkbtn" id="goToday" hidden>Today</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button class="tab" data-view="today" aria-current="page">Today</button>
  <button class="tab" data-view="gym">Train</button>
  <button class="tab" data-view="coach">Coach</button>
  <button class="tab" data-view="trends">Trends</button>
  <button class="tab" data-view="profile">Profile</button>
</div></nav>
<dialog id="dlg"></dialog>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="reportInput" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="indbInput" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="calc.js"></script>
<script src="foods.js"></script>
<script src="backend.js"></script>
<script src="app.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
