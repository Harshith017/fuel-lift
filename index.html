<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MaxxTempo">
<meta name="theme-color" content="#07060B">
<script>try{var t=localStorage.getItem("mt:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<title>MaxxTempo</title>
<meta name="description" content="Food, training, recovery and health tracking, with AI reading what you type.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#ECEEF5; --ink:#1F2233; --ink-2:#555A70; --ink-3:#83889C; --line:#E4E7EF;
  --accent:#7B61FF; --accent-ink:#FFFFFF; --accent-text:#6147E0;
  --grad:linear-gradient(90deg,#8B6CFF 0%,#5A7CF6 100%); --glow:0 6px 16px rgba(123,97,255,.28); --card-shadow:0 4px 18px rgba(31,34,60,.06);
  --protein:#7B61FF; --carbs:#F29B4B; --fat:#E86AA6; --water:#4A90E2;
  --good:#3A7BD5; --warn:#E0822E; --bad:#E0484B;
  --btn:#7B61FF; --btn-ink:#FFFFFF; --focus:#7B61FF;
  --tab-on:rgba(123,97,255,.11); --tab-on-ink:#6147E0; --label-line:#1F2233;
  --st-under:#F29B4B; --st-under-t:#A4520F; --st-at:#7B61FF; --st-at-t:#6147E0; --st-over:#EF5B5B; --st-over-t:#D63D3D; --st-plus:#3A7BD5; --st-plus-t:#2E66B8;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#07060B; --surface:#121017; --surface-2:#1E1B26; --ink:#F5F3FA; --ink-2:#B3ADC4; --ink-3:#817B93; --line:#26222F;
    --accent:#8B5CF6; --accent-ink:#FFFFFF; --accent-text:#A78BFA;
    --grad:linear-gradient(90deg,#A855F7 0%,#6366F1 100%); --glow:0 0 22px rgba(139,92,246,.45);
    --protein:#F472B6; --carbs:#60A5FA; --fat:#C4B5FD; --water:#22D3EE;
    --good:#7DB6FB; --warn:#FFA35C; --bad:#F2556E; --btn:#8B5CF6; --btn-ink:#FFFFFF; --focus:#A78BFA;
    --tab-on:rgba(139,92,246,.18); --tab-on-ink:#C4B5FD; --label-line:#4A4458;
    --st-under:#FFA35C; --st-under-t:#FFB47A; --st-at:#A78BFA; --st-at-t:#BBA4FF; --st-over:#F2556E; --st-over-t:#F77A8E; --st-plus:#60A5FA; --st-plus-t:#7DB6FB; --card-shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#07060B; --surface:#121017; --surface-2:#1E1B26; --ink:#F5F3FA; --ink-2:#B3ADC4; --ink-3:#817B93; --line:#26222F;
  --accent:#8B5CF6; --accent-ink:#FFFFFF; --accent-text:#A78BFA;
  --grad:linear-gradient(90deg,#A855F7 0%,#6366F1 100%); --glow:0 0 22px rgba(139,92,246,.45);
  --protein:#F472B6; --carbs:#60A5FA; --fat:#C4B5FD; --water:#22D3EE;
  --good:#7DB6FB; --warn:#FFA35C; --bad:#F2556E; --btn:#8B5CF6; --btn-ink:#FFFFFF; --focus:#A78BFA;
  --tab-on:rgba(139,92,246,.18); --tab-on-ink:#C4B5FD; --label-line:#4A4458;
  --st-under:#FFA35C; --st-under-t:#FFB47A; --st-at:#A78BFA; --st-at-t:#BBA4FF; --st-over:#F2556E; --st-over-t:#F77A8E; --st-plus:#60A5FA; --st-plus-t:#7DB6FB; --card-shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600;letter-spacing:-.005em;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.datenav{display:flex;align-items:center;gap:4px}
.datenav .d{font-weight:600;min-width:118px;text-align:center;font-size:14px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{border-color:var(--ink-3)}
.linkbtn{border:0;background:none;color:var(--accent-text);cursor:pointer;font-weight:600;font-size:13px;padding:4px 6px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:520px}
.tab{border:0;background:none;padding:6px 2px;min-height:52px;border-radius:10px;cursor:pointer;font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.01em;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:var(--tab-on);color:var(--tab-on-ink)}

main{padding-block:16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:860px){.grid.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.panel{background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* logger */
.logger textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;line-height:1.4}
.logger textarea:focus{border-color:var(--ink-3)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--grad);color:var(--btn-ink);box-shadow:var(--glow);border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink-3)}
.btn.sm{padding:6px 11px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.photo-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:4px 6px 4px 4px;font-size:13px}
.photo-pill img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.status{font-size:13.5px;color:var(--ink-2);min-height:1em}
.status.err{color:var(--bad)}
.spacer{flex:1}
.tag{font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2)}
.tag.est{color:var(--warn)}

/* energy */
.energy{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.big{font-family:var(--display);font-size:52px;line-height:.9;font-weight:700;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--ink-3);font-weight:600}
@media (max-width:520px){.energy{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative}
.meter > i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ink)}
.meter.over > i{background:var(--bad)}
.macros{display:grid;gap:10px}
.macro{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center;font-size:14px}
.macro .lbl{display:flex;align-items:center;gap:6px;font-weight:600}
.swatch{width:10px;height:10px;border-radius:3px;flex:none}
.macro .v{text-align:right;font-variant-numeric:tabular-nums}

/* water */
.water-top{display:flex;align-items:baseline;gap:8px}
.water-top .big{font-size:40px}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:14px;height:20px;border:1.5px solid var(--water);border-radius:2px 2px 4px 4px;background:transparent}
.glass.on{background:var(--water)}

/* lists */
.meal{display:flex;flex-direction:column;gap:2px}
.meal-h{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:13.5px;text-transform:capitalize;color:var(--ink-3);border-bottom:1px solid var(--line);padding-block:4px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding-block:8px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item .kc{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.acts{display:flex;gap:2px}
.acts button{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:13px}
.acts button:hover{background:var(--surface-2);color:var(--ink)}
.empty{color:var(--ink-3);font-size:14px;padding-block:6px}

/* nutrition-facts style micros */
.facts{border:2px solid var(--label-line);border-radius:4px;padding:10px 12px}
.facts .fh{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;border-bottom:8px solid var(--label-line);padding-bottom:6px;text-transform:none}
.facts .dvh{display:flex;justify-content:flex-end;font-size:12px;font-weight:700;border-bottom:1px solid var(--label-line);padding-block:4px}
.facts .fr{display:grid;grid-template-columns:1fr 92px 48px;gap:8px;align-items:center;padding-block:5px;border-bottom:1px solid var(--line);font-size:13.5px}
.facts .fr:last-child{border-bottom:0}
.facts .fr b{font-weight:600}
.facts .fr .amt{color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.facts .fr .dv{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.facts .fr .dv.over{color:var(--bad)}
.facts .fr .dv.low{color:var(--ink-3)}
.facts .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:-2px}
.facts .bar i{display:block;height:100%;background:var(--ink-2);border-radius:2px}
.facts .bar i.over{background:var(--bad)}
.facts .bar i.done{background:var(--good)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .l{font-size:12px;color:var(--ink-3);font-weight:600}
.tile .v{font-family:var(--display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.delta{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--ink-3)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--grad);color:var(--btn-ink)}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td.l,th.l{white-space:normal}
th.r,td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--surface-2)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 4}
.chart .ref-t{fill:var(--ink-2);font-weight:600}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:6px;white-space:pre;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.18)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 10px;font-weight:400;color:var(--ink);width:100%}
.field .hint{font-weight:400;color:var(--ink-3);font-size:12px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}

.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hgrid .l{font-size:12px;color:var(--ink-3);font-weight:600}
.hgrid .meter{margin-block:6px 2px}
.pill{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1.5px solid var(--line);color:var(--ink-2)}
.pill.good,.pill.warn,.pill.bad{border-color:currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.stk{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;cursor:pointer}
.stk .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.stk.on{border-color:var(--good)} .stk.on .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.tiles.five{grid-template-columns:repeat(2,1fr)} .tiles.five .tile:last-child{grid-column:1/-1}
@media (min-width:860px){.tiles.five{grid-template-columns:repeat(5,1fr)} .tiles.five .tile:last-child{grid-column:auto}}
@media (max-width:640px){.tiles.five{grid-template-columns:repeat(3,1fr);gap:8px} .tiles.five .tile.hs{display:none} .tiles.five .tile:last-child{grid-column:auto}
  .tiles.five .tile{padding:10px;border-radius:10px} .tiles.five .tile .v{font-size:22px!important;line-height:1.15!important} .tiles.five .tile .l{font-size:10.5px} .tiles.five .delta{font-size:11.5px;line-height:1.3}}
details.micros>summary{list-style:none;display:flex;align-items:baseline;justify-content:space-between;gap:12px;cursor:pointer}
details.micros>summary::-webkit-details-marker{display:none}
details.micros>summary::after{content:'▾';color:var(--ink-3);margin-left:8px} details.micros[open]>summary::after{content:'▴'}
details.micros[open]>summary{margin-bottom:12px}
details.micros>summary .muted{white-space:nowrap;margin-left:auto}
.qcard{border:1.5px solid var(--ink-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.qhead{font-weight:700}
.qs{display:flex;flex-direction:column;gap:12px}
.q{display:flex;flex-direction:column;gap:6px}
.qt{font-size:14px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--grad);color:var(--btn-ink);border-color:transparent}
.qin{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;width:100%}
.act{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act-h{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.act .nm{font-weight:600}
.act .sub{font-size:12.5px;color:var(--ink-3)}
.rec{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:8px;padding:10px}
.tips{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.how summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.how ul{margin:6px 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.setup{max-width:720px;margin-inline:auto;width:100%}
.setup p{margin:0}
.banner .linkbtn{margin-left:4px}
.findings{display:flex;flex-direction:column;gap:10px}
.finding{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.rev-head{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.ideas{display:grid;gap:8px}
.idea{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.idea .linkbtn{align-self:flex-start;padding-left:0}
.plan-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:14px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,14,12,.45)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100vw - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.meter>i,.facts .bar i{transition:width .35s ease}}

/* standalone additions */
[hidden]:not([hidden=until-found i]){display:none!important}
@media (max-width:420px){.brand{font-size:20px}.datenav{gap:2px}.datenav .d{min-width:0;font-size:13px}.iconbtn{width:30px;height:30px}}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:3px;background:transparent}
.sync.synced{background:var(--good)} .sync.saving{background:var(--warn)} .sync.offline{background:var(--ink-3)} .sync.error{background:var(--bad)}
.setup{margin-top:24px}
.setup p{line-height:1.5}

/* dashboard cells */
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
@media (min-width:760px){.dash .dgrid{grid-template-columns:repeat(6,1fr)}}
.dcell{display:flex;flex-direction:column;gap:3px;min-width:0}
.dcell .l{font-size:12px;color:var(--ink-3);font-weight:600}
.dcell .p{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.dcell .p small{font-size:14px;color:var(--ink-3);margin-left:1px;font-weight:600}
.dcell .p.bad{color:var(--bad)}
.dcell .meter{height:6px;margin:2px 0}
.dcell .val{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.3}
/* gym progress */
.exgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.exgrid{grid-template-columns:repeat(3,1fr)}}
.excell{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;color:inherit;font:inherit;cursor:pointer;min-width:0}
.excell.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.excell .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.excell .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.excell .v small{font-size:12px;color:var(--ink-3)}
.excell .delta{font-size:12px}
.spark{width:100%;height:26px;margin-top:4px}
/* 7-day bars */
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wb{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wv{font-size:10.5px;color:var(--ink-3);height:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wtrack{position:relative;width:100%;max-width:30px;height:64px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.wfill{position:absolute;left:0;right:0;bottom:0}
.wt{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--ink-2);z-index:1}
.wd{font-size:11px;color:var(--ink-3)} .wd.now{color:var(--ink);font-weight:700}
.panel.wk{gap:10px}
table.hits th,table.hits td{text-align:center;padding:6px 3px} table.hits td.l,table.hits th.l{text-align:left} table.hits td.r{text-align:right}
.hits .st{font-weight:700} .st-under{color:var(--st-under-t)} .st-at{color:var(--st-at-t)} .st-over{color:var(--st-over-t)} .st-plus{color:var(--st-plus-t)}
.stkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3)} .stkey i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
/* folding rows */
.panel.folds{padding:0;gap:0}
.fold{border-bottom:1px solid var(--line)} .fold:last-child{border-bottom:0}
.fold>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:52px;cursor:pointer}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .ttl{font-weight:650;flex:1;min-width:0}
.fold>summary .sub{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.fold>summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg) translateY(-2px);flex:none;transition:transform .15s}
.fold[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.fold-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fold-body .panel{border:0;padding:0;background:none;border-radius:0}
.fold-body>.grid,.fold-body .grid{gap:12px}
h2.sect{font-size:17px;color:var(--ink-2);margin:8px 0 -4px}
.inp{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;color:var(--ink);font:inherit}

/* header settings menu */
.hright{display:flex;align-items:center;gap:8px}
.hright[hidden]{display:none}
.gear svg{width:19px;height:19px;fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu{position:fixed;z-index:30;top:calc(58px + env(safe-area-inset-top,0px));right:max(12px, calc((100vw - 1040px)/2));width:min(380px, calc(100vw - 24px));max-height:calc(100vh - 150px - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column}
.menu[hidden]{display:none}
.menu-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.menu-sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.menu-sec:last-child{border-bottom:0}
.menu-l{font-size:12px;color:var(--ink-3);font-weight:600}
.menu .datenav{justify-content:space-between}
.menu .datenav .d{flex:1}
.menu-pick{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-2)}
.fold.inline>summary{padding:10px 0;min-height:0}
.fold.inline>.fold-body{padding:0 0 4px}
.fold.inline{border-bottom:0}
.pastbar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:14px}
.pastbar .spacer{flex:1}
.menu .seg{align-self:flex-start}

/* dashboards (after the reference designs) */
.hello h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.hello p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.nring-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ringwrap{position:relative;width:148px;height:148px}
.rings{width:100%;height:100%}
.rings circle{transition:stroke-dasharray .5s ease}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringc b{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.ringc span{font-size:10.5px;color:var(--ink-3)}
.nsum{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.nbig{font-size:15px;color:var(--ink-2)} .nbig b{font-size:30px;font-weight:700;letter-spacing:-.02em}
.mrows{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:10px 1fr auto 42px 76px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.mrow .sw{width:10px;height:10px;border-radius:3px}
.mrow .mv{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap} .mrow .mv .muted{font-weight:400}
.mrow .mp{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.spill{display:inline-block;justify-self:end;white-space:nowrap;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:12px;text-align:center}
.stat3>div{display:flex;flex-direction:column;gap:1px} .stat3>div+div{border-left:1px solid var(--line)}
.stat3 b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums} .stat3 span{font-size:11.5px;color:var(--ink-3)}
.grow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.gicon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.gicon svg{width:20px;height:20px;fill:currentColor}
.gt{display:flex;flex-direction:column;min-width:0} .gt b{font-weight:600}
.glasses2{display:grid;grid-template-columns:repeat(6,44px);gap:4px 6px}
.gl{border:0;background:none;padding:6px 9px;width:44px;height:48px;cursor:pointer;border-radius:10px}
.gl:not(:disabled):active{background:var(--surface-2)}
.gl:disabled{cursor:default}
.gl svg{width:100%;height:100%}
.gl .cup{fill:var(--surface-2);stroke:color-mix(in srgb, var(--water) 45%, transparent);stroke-width:1.2}
.gl .fill{fill:transparent}
.gl.on .fill{fill:var(--water)} .gl.on .cup{stroke:var(--water)}
.goals .meter{margin-top:-4px}
.insight{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.insight>div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-top:9px}
.insight>div>span:nth-child(2){display:flex;flex-direction:column;font-size:13.5px}
.idot{width:9px;height:9px;border-radius:50%}
@media (max-width:380px){.ringwrap{width:124px;height:124px}.mrow{grid-template-columns:10px 1fr auto 36px 70px;gap:8px;font-size:13px}}
/* Archivo: wider cut for headings and headline numbers, the athletic look */
h1,h2,.brand,.nbig b,.ringc b,.stat3 b,.dcell .p,.excell .v,.tile .v,.big{font-stretch:112%}
.authalt{display:flex;flex-direction:column;gap:10px}
.btn.provider{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600}
.btn.provider:hover{border-color:var(--ink-3)}
.btn.provider.face{background:var(--grad);color:#fff;border:0;box-shadow:var(--glow)}
.ordiv{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12.5px} .ordiv::before,.ordiv::after{content:'';flex:1;height:1px;background:var(--line)}
.acts button.approve{background:var(--grad);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;opacity:1}
/* leaderboard */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin-top:4px}
.podium.few{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.pod .medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--ink-3)}
.pod.p1 .medal{background:linear-gradient(135deg,#F5C451,#D99A1E);width:36px;height:36px;font-size:17px}
.pod.p2 .medal{background:linear-gradient(135deg,#C9CED8,#98A0AE)} .pod.p3 .medal{background:linear-gradient(135deg,#E0A27A,#B8703F)}
.pod .pname{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pscore{font-size:24px;font-weight:800;font-stretch:112%;line-height:1} .pod .pscore small{font-size:11px;color:var(--ink-3);font-weight:600}
.pod .pline{font-size:11px;color:var(--ink-3);line-height:1.3}
.pod .pblock{width:100%;border-radius:10px 10px 4px 4px;background:var(--surface-2);margin-top:4px}
.pod.p1 .pblock{height:54px;background:color-mix(in srgb, var(--accent) 22%, var(--surface-2))} .pod.p2 .pblock{height:36px} .pod.p3 .pblock{height:24px}
.pod.me .pname{color:var(--accent-text)}
.brow{display:grid;grid-template-columns:28px 1fr auto 36px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.brow .brank{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.brow.me b{color:var(--accent-text)} .brow>.num{text-align:right;font-size:16px}
</style>
</head>

    </div>
